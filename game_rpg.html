<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trading Hub RPG</title>
    <style>
      body {
        font-size: 14px;
        margin: 0;
        background: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      #gameWrap {
        position: relative;
        width: 950px;
        height: 600px;
        border: 2px solid #222;
      }

      #questsPanel {
        position: absolute;
        top: 7rem;
        left: 20px;
        font-size: 12px;
        pointer-events: none;
        width: 105px;
      }

      #questsPanel strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }

      #questsPanel li {
        margin: 2px 0;
      }

      canvas {
        display: block;
      }

      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        pointer-events: none;
      }

      .panel {
        width: 50rem;
        pointer-events: auto;
        margin-bottom: 0.2rem;
      }

      #statusMsg {
        margin-top: 4px;
        min-height: 16px;
        font-size: 16px;
        color: #333;
      }
    </style>
    <script src="game_rpg_quests.js" defer></script>
    <script src="game_rpg_misc.js" defer></script>
    <script src="game_rpg_trade.js" defer></script>
    <script src="game_rpg_speak.js" defer></script>
    <script src="game_rpg_apple.js" defer></script>
    <script src="game_rpg_dagger.js" defer></script>
    <script src="game_rpg_helpers.js" defer></script>
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="game" width="950" height="600"></canvas>
      <div id="questsPanel">
        <strong>Quests:</strong>
        <div id="questsList"></div>
      </div>

      <div id="ui">
        <div class="panel">
          <span>WASD: Move</span>, <span>E: Buy</span>, <span>R: Sell</span>, <span>T: Talk</span>
        </div>

        <div class="panel">
          <strong>Player:</strong>
          <span id="goldEl"></span>,
          <span id="appleEl"></span>,
          <span id="daggerEl"></span>,
          <!--
          <span id="flowerEl"></span>,
          <span id="carrotEl"></span>,
          <span id="acornEl"></span>,
          -->
          <span id="mushroomEl"></span>,
          <span id="twigEl"></span>,
          <span id="onionEl"></span>
        </div>

        <div class="panel">
          <strong>Trader:</strong>
          <span id="traderStockEl"></span>
          <div id="statusMsg"></div>
        </div>
      </div>
    </div>
  </body>
</html>
